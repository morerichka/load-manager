name: Desktop builds (unsigned)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            artifact: dist/LoadManager
          - os: macos-latest
            label: macos-arm64
            artifact: dist/LoadManager.app
          - os: macos-15-intel
            label: macos-x64
            artifact: dist/LoadManager.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[desktop,dev]"
      - run: python -m pytest -q
      - run: python scripts/build.py
      - name: Archive macOS bundle (preserve executable permissions and symlinks)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/LoadManager.app dist/LoadManager-${{ matrix.label }}.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: loadmanager-${{ matrix.label }}-unsigned
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: loadmanager-${{ matrix.label }}-unsigned
          path: dist/LoadManager-${{ matrix.label }}.zip
          if-no-files-found: error
