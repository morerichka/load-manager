[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "loadmanager"
version = "0.8.0"
description = "A process priority and memory manager for Windows and macOS"
requires-python = ">=3.11"
dependencies = ["psutil==7.2.2"]

[project.optional-dependencies]
desktop = ["pywebview==6.2.1"]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.scripts]
loadmanager = "loadmanager.app:main"
lm = "loadmanager.cli:lm_main"

[tool.setuptools.package-data]
loadmanager = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/*.svg", "ui/*.ico", "skill/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

